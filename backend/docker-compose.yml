services:
  db:
    image: postgres:16
    container_name: ssms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssms_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ssms_db}
    ports:
      - "5432:5432"
    volumes:
      - ssms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssms_user} -d ${POSTGRES_DB:-ssms_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ssms_pgdata:
    name: ssms_pgdata
